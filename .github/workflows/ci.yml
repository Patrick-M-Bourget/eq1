name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each step runs one part of scripts/check.sh, so a local run of the script checks what CI checks.
# On a pull request, macOS leaves out the two slowest steps, ThreadSanitizer and plugin validation
# (about 8 of its 13 minutes): they run on main after the merge.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-latest
          - name: Windows x64
            os: windows-latest
    defaults:
      run:
        shell: bash
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
      GH_TOKEN: ${{ github.token }}
      # sccache caches compiled objects in the GitHub Actions cache, so unchanged JUCE modules and
      # sources aren't compiled again. Universal macOS objects (two -arch flags) are cached too.
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_MULTIARCH: "1"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache

    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      # Puts cl and Visual Studio's Ninja on the PATH, so scripts/check.sh builds with Ninja.
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache dependencies and validators
        uses: actions/cache@v5
        with:
          path: .deps
          # A restored folder built with another CMake generator is rebuilt by scripts/check.sh build.
          key: deps-v2-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'scripts/check.sh') }}
          # A miss starts from the last saved dependencies (and the juceaide built in them), not from nothing.
          restore-keys: deps-v2-${{ runner.os }}-

      - name: Doc references
        run: scripts/check.sh docs

      - name: Build
        run: scripts/check.sh build

      # Time limits of about twice a normal run, so a step that slows down fails and names itself
      # (scripts/ci-timings.sh shows each step's time). Build has none: a cold compiler cache varies too much.
      - name: Engine and Plugin Shell tests
        timeout-minutes: 8
        run: scripts/check.sh test

      - name: CPU budget
        timeout-minutes: 3
        run: scripts/check.sh cpu

      - name: Engine tests under ThreadSanitizer
        if: runner.os == 'macOS' && github.event_name == 'push'
        timeout-minutes: 15
        run: scripts/check.sh tsan

      - name: Validate plugins (pluginval, auval, clap-validator, AAX and Standalone built)
        if: runner.os == 'Windows' || github.event_name == 'push'
        timeout-minutes: 8
        run: scripts/check.sh validate

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

      - uses: actions/upload-artifact@v6
        with:
          name: eq1-${{ runner.os }}
          path: |
            build/plugin/eq1_artefacts/Release/VST3
            build/plugin/eq1_artefacts/Release/AU
            build/plugin/eq1_artefacts/Release/AAX
            build/plugin/eq1_artefacts/Release/CLAP
            build/plugin/eq1_artefacts/Release/Standalone
